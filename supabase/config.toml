# Stripe llama al webhook sin token de Supabase: con verify_jwt la pasarela lo
# rechaza con 401 antes de llegar al código. La función ya verifica la firma de
# Stripe (constructEventAsync con STRIPE_WEBHOOK_SECRET).
[functions.stripe-webhook]
verify_jwt = false

# La llama pg_cron (tarea send-email-digest) sin token de usuario. La función
# comprueba la cabecera x-cron-secret contra el secreto guardado en Vault.
[functions.send-digest]
verify_jwt = false
