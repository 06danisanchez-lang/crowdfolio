name: Deploy Edge Functions

# Al mergear en main, despliega solo las Edge Functions que han cambiado.
# Antes había que acordarse de ejecutar `supabase functions deploy` a mano.
#
# Requiere el secreto SUPABASE_ACCESS_TOKEN en GitHub
# (Settings → Secrets and variables → Actions). El token se crea en
# https://supabase.com/dashboard/account/tokens
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Función a desplegar (vacío = las que cambiaron en el último push)'
        required: false

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eazwouasdrcbucxwjfxy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Funciones a desplegar
        id: changed
        env:
          INPUT_FUNCTION: ${{ github.event.inputs.function }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_FUNCTION" ]; then
            fns="$INPUT_FUNCTION"
          else
            before="$BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="HEAD~1"
            fi
            fns=$(git diff --name-only "$before" "${{ github.sha }}" -- supabase/functions \
              | awk -F/ 'NF>=4 {print $3}' | sort -u \
              | while read -r f; do [ -d "supabase/functions/$f" ] && echo "$f"; done | tr '\n' ' ')
          fi
          echo "Funciones: ${fns:-ninguna}"
          echo "fns=$fns" >> "$GITHUB_OUTPUT"

      - name: Desplegar
        if: steps.changed.outputs.fns != ''
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub."
            exit 1
          fi
          for fn in ${{ steps.changed.outputs.fns }}; do
            echo "Desplegando $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
