name: CI

# Se ejecuta en cada PR y en cada push a main. Si falla algo, no se mergea.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Base de datos de pruebas: estructura de producción + migraciones nuevas +
  # pruebas de permisos (RLS). Ver CLAUDE.md, "Base de datos de pruebas".
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Migraciones y pruebas de permisos
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: scripts/db-test.sh
